<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIDEOFOTISTA MONETÁRIO</title>
<meta name="theme-color" content="#3B3B3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monetário">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone.png">
<link rel="apple-touch-icon" href="icone-ios.png">
<style>
/* Layout: app de uma coluna, cabeçalho fixo com o mês, abas embaixo no celular, botão de lançar sempre à mão */
:root{
  /* Paleta do Renato: cinza #737373, branco e amarelo #ffde59. Tema único. */
  --bg:#3B3B3B; --surface:#474747; --sunk:#414141; --ink:#FFFFFF; --muted:#BDBDBD; --line:#575757;
  --accent:#F4C84A; --accent-ink:#2B2B2B; --accent-soft:#544A2C;
  --in:#F4C84A; --in-soft:#544A2C; --out:#FFFFFF; --out-soft:#3F3F3F; --neg:#FF9F8F; --prev:#D9D2FF;
  --f-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  --f-body:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --r:12px; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:none;padding:6px 10px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px}
.tabs button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.period{display:flex;align-items:center;gap:8px;margin-top:10px}
.period h2{font-family:var(--f-display);font-weight:600;font-size:26px;margin:0;flex:1;letter-spacing:-.01em}
.period h2 small{font-family:var(--f-body);font-size:15px;color:var(--muted);font-weight:500;margin-left:6px}
.navbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.hoje{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}

.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.sum .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sum .v{font-family:var(--f-display);font-weight:600;font-size:20px;overflow:hidden;text-overflow:ellipsis}
.sum.in .v{color:var(--in)} .sum.out .v{color:var(--out)}
.sum.saldo.neg .v{color:var(--neg)} .sum.saldo.pos .v{color:var(--in)}
.sum .sub{font-size:12px;color:var(--muted)}
@media (max-width:480px){.summary{grid-template-columns:1fr 1fr}.summary .sum.saldo{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline}.sum .v{font-size:19px;overflow:visible}}

.alert{margin-top:12px;border-radius:var(--r);padding:10px 12px;background:var(--accent-soft);border:1px solid var(--accent);font-size:14px;display:flex;gap:8px;align-items:flex-start}
.alert b{font-weight:700}

section.blk{margin-top:22px}
.blk-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.blk-h h3{margin:0;font-family:var(--f-display);font-size:18px;font-weight:600}
.blk-h .num{color:var(--muted);font-weight:600}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:8px;overflow:hidden}
.grp-h{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;background:var(--sunk);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.grp-h + .row{border-top:0}
.row .nm{min-width:0;flex:1;overflow-wrap:anywhere}
.row .meta{display:block;font-size:12px;color:var(--muted)}
.row.cat{font-weight:600}
.row.cat .chev{color:var(--muted);font-size:12px;margin-left:6px;display:inline-block;transition:transform .15s}
.row.cat[aria-expanded="true"] .chev{transform:rotate(90deg)}
.entries{background:var(--bg)}
.entries .row{padding-left:24px;font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.prev{background:transparent;border:1px dashed var(--prev);color:var(--prev)}
.tag.card{background:var(--accent-soft);color:var(--accent)}
.is-prev .num{color:var(--prev);font-style:italic}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.mini.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.cardbox{padding:12px;border-top:1px solid var(--line);display:grid;gap:6px}
.cardbox:first-of-type{border-top:0}
.cardbox .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.cardbox .top b{font-size:15px}
.cardbox .top span{font-size:12px;color:var(--muted)}
.fatline{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.fatline.strong{color:var(--ink);font-weight:700}
.fatin{display:flex;gap:8px;align-items:center}
.fatin input{flex:1;min-width:0}
.warn{color:var(--neg);font-size:13px}

.empty{padding:16px 12px;color:var(--muted);font-size:14px}

/* Ano */
.tblwrap{overflow:auto;overscroll-behavior:contain;max-height:calc(100vh - 250px);max-height:calc(100dvh - 250px);min-height:240px;margin-top:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);scrollbar-color:var(--accent) var(--sunk);scrollbar-width:auto}
.tblwrap::-webkit-scrollbar{height:14px;width:12px}
.tblwrap::-webkit-scrollbar-track{background:var(--sunk)}
.tblwrap::-webkit-scrollbar-thumb{background:var(--accent);border-radius:999px;border:3px solid var(--sunk)}
.tblnav{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.tblnav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
table.grid{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.grid th,.grid td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.grid th:first-child,.grid td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;max-width:190px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
.grid thead th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface);position:sticky;top:0;z-index:2}
.grid thead th:first-child{z-index:3}
.grid thead th button{border:0;background:none;font:inherit;color:inherit;letter-spacing:inherit;padding:0}
.grid thead th.cur{color:var(--accent)}
.grid tr.g td{background:var(--sunk);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.grid tr.g td:first-child{background:var(--sunk)}
.grid tr.tot td{font-weight:700}
.grid tr.tot.out td:not(:first-child){color:var(--out)}
.grid tr.tot.in td:not(:first-child){color:var(--in)}
.grid td.z{color:var(--line)}
.grid td.p{color:var(--prev);font-style:italic}
.grid td.t{font-weight:700;background:var(--sunk)}
.grid tr.spacer td{border-bottom:0;padding:6px}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.legend i{color:var(--prev)}

/* Assinaturas */
.subs{display:grid;gap:8px;margin-top:12px}
.sub-c{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:4px}
.sub-c .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sub-c .l1 b{font-size:16px;min-width:0;overflow-wrap:anywhere}
.sub-c .l2{font-size:13px;color:var(--muted)}
.sub-c.ended{opacity:.6}
.sub-c .acts{justify-content:flex-start;margin-top:6px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--ink);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--out-soft);color:var(--neg)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}

/* FAB */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;padding:14px 22px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
@media (max-width:620px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;
    padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
  .fab{bottom:calc(66px + env(safe-area-inset-bottom,0px))}
  body{padding-bottom:150px}
}

/* Folha de lançamento */
.sheet-bg{position:fixed;inset:0;background:rgba(20,20,20,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:621px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet h4{margin:0 0 12px;font-family:var(--f-display);font-size:20px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sheet h4 button{border:0;background:var(--sunk);width:32px;height:32px;border-radius:50%;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:8px;border-radius:8px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"].s{background:var(--ink);color:var(--accent-ink)}
.seg button[aria-pressed="true"].e{background:var(--accent);color:var(--accent-ink)}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.stmt{background:var(--surface);border-radius:14px;overflow:hidden;font-size:13.5px}
.st-h,.st-row{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto 6.6em;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit;font:inherit}
.st-h{border-top:0;background:var(--sunk);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.st-row .dt{color:var(--muted);font-variant-numeric:tabular-nums}
.st-row .ds{min-width:0;overflow-wrap:anywhere}
.st-row .ds b{font-weight:600}
.st-row .ds small{display:block;font-size:11.5px;color:var(--muted)}
.st-row .r{text-align:right;white-space:nowrap}
.st-row .cr{color:var(--in)}
.st-row .neg{color:var(--neg)}
.st-bal{background:var(--sunk);font-weight:700}
.st-bal span:first-child{color:var(--muted);font-weight:500}
.st-tot{margin-top:12px}
.st-tot .st-row:first-child{border-top:0}
@media (max-width:420px){.st-h,.st-row{grid-template-columns:2.8em minmax(0,1fr) auto;}.st-h span:last-child,.st-row>span:last-child:empty{display:none}.st-bal>span:nth-child(3){display:none}}
.mviews{margin:4px 0 14px}
.mviews button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.xbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.xbar select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;max-width:100%}
.xday .grp-h .num{letter-spacing:0;text-transform:none}
.row .num.in{color:var(--in)}
.xday .row .nm b{font-weight:600}
.seg.three button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fld{display:grid;gap:4px;margin-top:12px}
.fld label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea,.fatin input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
.fld input.big{font-family:var(--f-display);font-size:28px;font-weight:600;padding:8px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .fld{min-width:0}
.hint{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 10px;margin-top:8px}
.hint b{color:var(--ink)}
.formacts{display:flex;gap:8px;margin-top:18px;justify-content:space-between;flex-wrap:wrap}
.formacts .r{display:flex;gap:8px;margin-left:auto}
.err{color:var(--neg);font-size:14px;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px}

.qbox{margin-top:16px;position:relative}
.qbox input{width:100%;border:2px solid var(--accent);background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:17px}
.qsort{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.qsort button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.qsort button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qsum{display:flex;justify-content:space-between;gap:8px;margin:12px 2px 6px;color:var(--muted);font-size:14px}
.qsum b{color:var(--ink)}
.qtips{color:var(--muted);font-size:14px;margin-top:12px;max-width:62ch}
.home-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.hbtn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.hbtn b{font-size:17px;font-family:var(--f-display);font-weight:600}
.hbtn span{font-size:13px;color:var(--muted)}
.hbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hbtn.pri span{color:var(--accent-ink);opacity:.8}
.due{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.grp-h + .due{border-top:0}
.due .d{width:46px;flex:none;text-align:center;border-radius:10px;background:var(--sunk);padding:4px 0;line-height:1.1}
.due .d b{display:block;font-size:18px;font-family:var(--f-display)}
.due .d small{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.due.late .d{background:var(--out-soft);outline:1px solid var(--neg)}
.due.late .d b,.due.late .when{color:var(--neg)}
.due.soon .d{outline:1px solid var(--accent)}
.due .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.due .when{display:block;font-size:12px;color:var(--muted);font-weight:500}
.due .num{font-weight:600}
.due .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips:empty{display:none}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 11px;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:active{background:var(--accent);color:var(--accent-ink)}
/* Ajustes */
.setrow{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.setrow.off .nm{color:var(--muted);text-decoration:line-through}
.note{color:var(--muted);font-size:14px;max-width:62ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
h1.fam{margin:0;display:inline-flex;flex-direction:column;gap:2px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;font-weight:900;font-size:22px;line-height:1;letter-spacing:1.2px}
h1.fam .marca{display:flex;align-items:center;color:#fff;white-space:nowrap}
h1.fam .marca svg{width:20px;height:20px;margin:0 2px;flex:none;color:var(--accent)}
h1.fam .app{color:var(--accent);text-align:center;white-space:nowrap}
h1.fam.big{font-size:30px;letter-spacing:1.6px}
h1.fam.big .marca svg{width:27px;height:27px}
#gate .logo{justify-content:center;margin-bottom:30px}
/* Cara do A Fazer: título centralizado, data embaixo, abas em pílula */
header.top{padding-block:18px 10px}
.brand{flex-direction:column;align-items:center;justify-content:flex-start;gap:0;flex-wrap:nowrap}
.brand h1.fam{font-size:24px}
.brand h1.fam .marca svg{width:22px;height:22px}
.hojeinfo{color:var(--muted);font-size:13px;margin-top:6px}
.syncinfo{display:inline-block;margin-top:6px;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:2px 8px;border-radius:99px}.syncinfo.alerta{background:var(--accent);color:#2b2b2b;font-weight:700;padding:5px 12px}
.tabs{position:static!important;margin-top:14px;gap:8px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding:2px 2px 4px!important;border:0!important;background:none!important;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:var(--surface);color:#fff;padding:8px 16px;font-weight:700;font-size:14px}
.tabs button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.period{margin-top:12px}
@media (max-width:620px){ .tabs{justify-content:space-between;gap:4px;width:100%} .tabs button{padding:7px 9px;font-size:13px} .fab{bottom:calc(18px + env(safe-area-inset-bottom,0px))!important} body{padding-bottom:110px!important} }
@media (max-width:370px){ .tabs button{padding:6px 7px;font-size:12.5px} }
html{background:#3B3B3B}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:max(28px,env(safe-area-inset-top,0px)) 20px 40px}
#gate .box{max-width:400px;margin:6vh auto 0}
#gate .logo{display:flex;align-items:center;gap:14px;margin-bottom:22px}
#gate h2{font-family:var(--f-display);font-size:22px;margin:0 0 6px}
#gate .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
#gate .lnk{background:none;border:0;color:var(--accent);text-decoration:underline;padding:6px 0;font-weight:600}
#gate .err{margin-top:12px}
.pill{display:inline-block;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 8px;margin-left:6px}
.sync{font-size:12px;color:var(--muted);text-align:center;margin:28px 0 0}
.cafe-link{display:block;margin:26px auto 0;background:none;border:0;color:var(--muted);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.cafe-link:hover{color:var(--accent)}

<body>
<div id="gate" hidden><div class="box" id="gatebox"></div></div>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 class="fam" aria-label="Videofotista Monetário"><span class="marca"><span>VIDEOF</span><svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10.5" fill="none" stroke="currentColor" stroke-width="4"/><text x="13" y="17.6" text-anchor="middle" font-size="13" font-weight="900" fill="currentColor" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">$</text></svg><span>TISTA</span></span><span class="app">MONETÁRIO</span></h1>
      <div class="hojeinfo" id="hojeinfo"></div><button class="syncinfo" id="syncinfo" data-act="sync" hidden></button>
      <nav class="tabs" id="tabs">
        <button data-tab="inicio" aria-current="true">Início</button>
        <button data-tab="mes">Mês</button>
        <button data-tab="ano">Ano</button>
        <button data-tab="ass">Fixas</button>
        <button data-tab="busca" aria-label="Buscar">Buscar</button>
        <button data-tab="aj">Ajustes</button>
      </nav>
    </div>
    <div class="period" id="period"></div>
    <div id="subnav"></div>
  </header>
  <main id="main"><p class="empty">Carregando os lançamentos…</p></main>
</div>
<button class="fab" id="fab" hidden>+ Lançar</button>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="imp_file" accept=".json,application/json" hidden>

<script>
(function(){
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const M3=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const brl=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const fmt=v=>brl.format(v||0);
const fmtS=v=>(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=v=>Math.round(v*100)/100;
function parseValor(s){ s=String(s||'').trim().replace(/[^0-9,.\-]/g,''); if(!s) return NaN;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  return r2(parseFloat(s)); }
const today=new Date();
const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
const curComp=todayStr.slice(0,7);
const compOf=(y,m)=>`${y}-${String(m).padStart(2,'0')}`;
function addM(comp,n){let [y,m]=comp.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return compOf(y,m)}
const mdiff=(a,b)=>{const [ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return (yb-ya)*12+(mb-ma)};
const compLabel=c=>{const [y,m]=c.split('-').map(Number);return `${MESES[m-1].toLowerCase()}/${y}`};

let _qs='desc'; try{_qs=localStorage.getItem('vm_qsort')||'desc'}catch(e){}
let _mv='bloco'; try{_mv=localStorage.getItem('vm_mesview')||'bloco'}catch(e){}
let _ps='pad'; try{_ps=localStorage.getItem('vm_psort')||'pad'}catch(e){}
const S={qsort:_qs,psort:_ps,mesView:_mv,xTipo:'todos',xPay:'',db:null,cfg:null,fat:{},recs:[],lanc:[],year:today.getFullYear(),month:today.getMonth()+1,tab:'inicio',open:{},loaded:{cfg:false,lanc:false},unsub:[]};

const catById=id=>S.cfg?.cats.find(c=>c.id===id);
const payById=id=>S.cfg?.pays.find(p=>p.id===id);

function compFor(dateStr,payId){
  const p=payById(payId); const base=dateStr.slice(0,7);
  if(!p||p.tipo!=='cartao') return base;
  const d=Number(dateStr.slice(8,10));
  const fecha=Number(p.fecha)||1, vence=Number(p.vence)||10;
  let close = d>=fecha ? addM(base,1) : base;
  return vence>fecha ? close : addM(close,1);
}

// ---------- dados derivados ----------
function recMonths(r,year){
  const out=[]; if(!r.inicio) return out;
  for(let m=1;m<=12;m++){const c=compOf(year,m);
    if(c<r.inicio) continue; if(r.fim && c>r.fim) continue;
    if(r.plano==='anual' && mdiff(r.inicio,c)%12!==0) continue;
    out.push(c);}
  return out;
}
const cliKey=x=>(norm(x||'').trim().split(/\s+/)[0]||'');
function coverSets(){
  const covered=new Set(S.lanc.filter(l=>l.recId).map(l=>l.recId+'|'+l.comp));
  const real=S.lanc.filter(l=>l.status!=='pulado');
  const catReal=new Set(real.map(l=>l.cat+'|'+l.comp)), cliReal=new Set(real.filter(l=>l.cliente).map(l=>l.cat+'|'+cliKey(l.cliente)+'|'+l.comp));
  return (r,c)=>covered.has(r.id+'|'+c)||(r.cliente?cliReal.has(r.cat+'|'+cliKey(r.cliente)+'|'+c):catReal.has(r.cat+'|'+c));
}
function entries(){
  const real=S.lanc.filter(l=>l.status!=='pulado');
  const isCov=coverSets();
  const virt=[];
  for(const r of S.recs){ for(const c of recMonths(r,S.year)){ if(isCov(r,c)) continue;
    virt.push({id:'v:'+r.id+':'+c,virtual:true,recId:r.id,cat:r.cat,valor:Number(r.valor)||0,comp:c,pay:r.pay,desc:r.nome,cliente:r.cliente||'',data:c+'-'+String(Math.min(Number(r.dia)||1,28)).padStart(2,'0')}); } }
  return real.concat(virt);
}
function tipoOf(e){return catById(e.cat)?.tipo||'s'}
function cardInfo(comp,E){
  const res=[];
  for(const p of (S.cfg?.pays||[]).filter(p=>p.tipo==='cartao')){
    const total=Number(S.fat?.[p.id]?.[comp])||0;
    const det=r2(E.filter(e=>e.pay===p.id&&e.comp===comp&&tipoOf(e)==='s').reduce((a,e)=>a+e.valor,0));
    const outros=total?r2(total-det):0;
    res.push({p,total,det,outros,neg:outros<0});
  }
  return res;
}
function monthTotals(comp,E){
  const inM=E.filter(e=>e.comp===comp);
  const s=inM.filter(e=>tipoOf(e)==='s'), en=inM.filter(e=>tipoOf(e)==='e');
  const cards=cardInfo(comp,E);
  const saida=r2(s.reduce((a,e)=>a+e.valor,0)+cards.reduce((a,c)=>a+Math.max(0,c.outros),0));
  const entrada=r2(en.reduce((a,e)=>a+e.valor,0));
  const prev=r2(inM.filter(e=>e.virtual&&tipoOf(e)==='s').reduce((a,e)=>a+e.valor,0));
  const prevE=r2(en.filter(e=>e.virtual).reduce((a,e)=>a+e.valor,0));
  return {saida,entrada,saldo:r2(entrada-saida),prev,prevE,cards,s,en};
}
function groupsOf(tipo){
  const gs=[]; for(const c of S.cfg.cats.filter(c=>c.tipo===tipo).sort((a,b)=>a.ordem-b.ordem)) if(!gs.includes(c.grupo)) gs.push(c.grupo);
  return gs;
}
function renewals(){
  const out=[];
  for(const r of S.recs){ if(r.fim && r.fim<curComp) continue;
    let alvo=null;
    if(r.plano==='fidelidade'&&r.renova) alvo=r.renova;
    if(r.plano==='anual'&&r.inicio){ let c=r.inicio; while(c<curComp) c=addM(c,12); alvo=c; }
    if(alvo){const d=mdiff(curComp,alvo); if(d>=0&&d<=1) out.push({r,alvo});}
  }
  return out;
}

// ---------- render ----------
const main=document.getElementById('main');
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.tab===S.tab)));
  document.getElementById('fab').hidden=!S.db||!S.cfg||S.tab==='inicio';
  renderPeriod();
  if(!S.db){ main.innerHTML=`<p class="empty">Conectando…</p>`; return; }
  if(!S.cfg){ main.innerHTML=S.loaded.cfg?vazioHtml():`<p class="empty">Carregando os lançamentos…</p>`; return; }
  if(S.tab==='inicio') renderInicio(); else if(S.tab==='mes') renderMes(); else if(S.tab==='ano') renderAno(); else if(S.tab==='ass') renderAss(); else if(S.tab==='busca') renderBusca(); else renderAj();
}
const DIAS=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
function renderHoje(){ const el=document.getElementById('hojeinfo'); if(el) el.textContent=`${DIAS[today.getDay()]}, ${today.getDate()} de ${MESES[today.getMonth()].toLowerCase()}`; }
function renderPeriod(){
  renderHoje();
  const el=document.getElementById('period');
  if(S.tab==='inicio'){ document.getElementById('subnav').innerHTML=''; el.innerHTML=`<h2>${MESES[today.getMonth()]}<small>${today.getFullYear()} · hoje, ${String(today.getDate()).padStart(2,'0')}/${String(today.getMonth()+1).padStart(2,'0')}</small></h2>`; return; }
  document.getElementById('subnav').innerHTML=S.tab==='ano'&&S.cfg?'<div class="tblnav"><button data-act="scrL">‹ Meses anteriores</button><button data-act="scrR">Próximos meses ›</button></div>':'';
  if(S.tab==='mes'){
    const isCur=compOf(S.year,S.month)===curComp;
    el.innerHTML=`<button class="navbtn" data-act="prevM" aria-label="Mês anterior">‹</button><h2>${MESES[S.month-1]}<small>${S.year}</small></h2>${isCur?'':'<button class="hoje" data-act="hoje">Hoje</button>'}<button class="navbtn" data-act="nextM" aria-label="Próximo mês">›</button>`;
  } else if(S.tab==='ano'){
    el.innerHTML=`<button class="navbtn" data-act="prevY" aria-label="Ano anterior">‹</button><h2>${S.year}<small>ano inteiro</small></h2><button class="navbtn" data-act="nextY" aria-label="Próximo ano">›</button>`;
  } else if(S.tab==='ass'){ el.innerHTML=`<h2>Fixas<small>contas e assinaturas</small></h2>`; }
  else if(S.tab==='ass') {}
  else if(S.tab==='busca') el.innerHTML=`<h2>Buscar<small>em todos os anos</small></h2>`;
  else el.innerHTML=`<h2>Ajustes<small>categorias e cartões</small></h2>`;
}
function entryRow(e){
  const p=payById(e.pay); const card=p&&p.tipo==='cartao';
  const dt=e.data?e.data.slice(8,10)+'/'+e.data.slice(5,7):'';
  const meta=[dt, e.cliente, e.parcela?('parcela '+e.parcela):''].filter(Boolean).join(' · ');
  const txt=e.desc||catById(e.cat)?.nome||'';
  if(e.virtual) return `<div class="row is-prev"><span class="nm">${esc(txt)}<span class="tag prev">previsto</span>${card?`<span class="tag card">${esc(p.nome.replace('Cartão ',''))}</span>`:''}</span><span class="num">${fmt(e.valor)}</span><span class="acts"><button class="mini ok" data-act="confirm" data-id="${esc(e.id)}">Confirmar</button><button class="mini" data-act="skip" data-id="${esc(e.id)}">Não veio</button></span></div>`;
  return `<button class="row" data-act="edit" data-id="${esc(e.id)}"><span class="nm">${esc(txt)}${card?`<span class="tag card">${esc(p.nome.replace('Cartão ',''))}</span>`:''}<span class="meta">${esc(meta)}</span></span><span class="num">${fmt(e.valor)}</span></button>`;
}
function catBlock(tipo,list){
  let html='';
  for(const g of groupsOf(tipo)){
    const cats=S.cfg.cats.filter(c=>c.tipo===tipo&&c.grupo===g).sort((a,b)=>a.ordem-b.ordem);
    const rows=[]; let gt=0;
    for(const c of cats){ const es=list.filter(e=>e.cat===c.id); if(!es.length) continue;
      const t=r2(es.reduce((a,e)=>a+e.valor,0)); gt+=t; const k=tipo+c.id; const op=!!S.open[k];
      const allPrev=es.every(e=>e.virtual);
      rows.push(`<button class="row cat${allPrev?' is-prev':''}" data-act="toggle" data-k="${esc(k)}" aria-expanded="${op}"><span class="nm">${esc(c.nome)}${es.length>1?`<span class="tag">${es.length}</span>`:''}<span class="chev">▸</span></span><span class="num">${fmt(t)}</span></button>`
        + (op?`<div class="entries">${es.sort((a,b)=>(a.data||'').localeCompare(b.data||'')).map(entryRow).join('')}</div>`:''));
    }
    if(rows.length) html+=`<div class="grp"><div class="grp-h"><span>${esc(g)}</span><span class="num">${fmt(gt)}</span></div>${rows.join('')}</div>`;
  }
  return html;
}
function renderMes(){
  const E=entries(); const comp=compOf(S.year,S.month); const T=monthTotals(comp,E);
  const ren=renewals();
  const pend=T.s.filter(e=>e.virtual).length;
  const mv=S.mesView==='extrato'?'extrato':'bloco';
  const tog=`<div class="seg mviews" role="group" aria-label="Como ver o mês"><button data-act="mesview" data-k="bloco" aria-pressed="${mv==='bloco'}">Por bloco</button><button data-act="mesview" data-k="extrato" aria-pressed="${mv==='extrato'}">Extrato do dia a dia</button></div>`;
  if(mv==='extrato'){ main.innerHTML=tog+extratoHtml(); return; }
  let h=tog+`<div class="summary">
    <div class="sum in"><div class="lbl">Entrou</div><div class="v num">${fmt(T.entrada)}</div>${T.prevE?`<div class="sub">${fmt(T.prevE)} a receber</div>`:""}</div>
    <div class="sum out"><div class="lbl">Saiu</div><div class="v num">${fmt(T.saida)}</div>${T.prev?`<div class="sub">${fmt(T.prev)} previsto</div>`:''}</div>
    <div class="sum saldo ${T.saldo<0?'neg':'pos'}"><div class="lbl">Saldo</div><div class="v num">${fmt(T.saldo)}</div></div></div>`;
  if(ren.length) h+=ren.map(x=>`<div class="alert"><span>⟳</span><span><b>${esc(x.r.nome)}</b> renova em ${compLabel(x.alvo)}. Vale decidir se continua.</span></div>`).join('');
  if(pend) h+=`<div class="alert"><span>◌</span><span>${pend} ${pend>1?'cobranças previstas':'cobrança prevista'} neste mês. Confirme quando a fatura chegar, ajustando o valor se mudou.</span></div>`;
  // Saídas
  h+=`<section class="blk"><div class="blk-h"><h3>Saídas</h3><span class="num">${fmt(T.saida)}</span></div>`;
  const sb=catBlock('s',T.s);
  // cartões
  const cardsHtml=T.cards.map(c=>{
    const fid=`fat_${c.p.id}`;
    return `<div class="cardbox"><div class="top"><b>${esc(c.p.nome)}</b><span>fecha dia ${esc(c.p.fecha)} · vence dia ${esc(c.p.vence)}</span></div>
      <div class="fatin"><input id="${fid}" inputmode="decimal" placeholder="Total da fatura" value="${c.total?fmtS(c.total):''}" aria-label="Total da fatura ${esc(c.p.nome)}"><button class="mini" data-act="savefat" data-p="${esc(c.p.id)}">Salvar</button></div>
      <div class="fatline"><span>Lançado com detalhe</span><span class="num">${fmt(c.det)}</span></div>
      <div class="fatline strong"><span>Outros gastos do cartão</span><span class="num">${c.total?fmt(Math.max(0,c.outros)):'–'}</span></div>
      ${c.neg?`<div class="warn">O detalhado passou do total da fatura em ${fmt(-c.outros)}. Confira o total ou algum lançamento.</div>`:''}</div>`;}).join('');
  h+= (sb||`<div class="grp"><p class="empty">Nenhuma saída em ${MESES[S.month-1].toLowerCase()} ainda. Toque em + Lançar para registrar a primeira.</p></div>`);
  h+=`<div class="grp"><div class="grp-h"><span>Faturas de cartão</span><span class="num">${fmt(T.cards.reduce((a,c)=>a+Math.max(0,c.outros),0))}</span></div>${cardsHtml}</div></section>`;
  // Entradas
  h+=`<section class="blk"><div class="blk-h"><h3>Entradas</h3><span class="num">${fmt(T.entrada)}</span></div>`;
  h+= catBlock('e',T.en)||`<div class="grp"><p class="empty">Nenhuma entrada neste mês ainda.</p></div>`;
  h+=`</section>`;
  main.innerHTML=h;
}
const isBoletoPay=p=>!!p&&p.tipo==='conta'&&/boleto/i.test(p.nome||'');
const isRealAcct=p=>!!p&&p.tipo==='conta'&&p.id!=='conta'&&!isBoletoPay(p);
function allLanc(){ const m=new Map(); (S.all||[]).forEach(l=>{ if(Number(l.ano)!==S.year) m.set(l.id,l); }); S.lanc.forEach(l=>m.set(l.id,l)); return [...m.values()].filter(l=>l.status!=='pulado'&&(Number(l.valor)||0)>0&&l.data); }
function acctTxns(aid){
  const out=[];
  for(const l of allLanc()){ const p=payById(l.pay); const isE=tipoOf(l)==='e'; const v=Number(l.valor);
    if(l.pay===aid) out.push({data:l.data,v:isE?v:-v,l,ord:l.criado||''});
    else if(p&&p.tipo==='conta'&&p.pagoPor===aid) out.push({data:l.data,v:isE?v:-v,l,via:p.nome,ord:l.criado||''}); }
  const fats=Object.assign({},S.fatAll||{}); fats[String(S.year)]=S.fat||{};
  for(const c of (S.cfg.pays||[]).filter(x=>x.tipo==='cartao'&&x.pagoPor===aid)){
    for(const y in fats){ const m=(fats[y]||{})[c.id]||{}; for(const comp in m){ const t=Number(m[comp])||0; if(t>0) out.push({data:dueDate(comp,c.vence),v:-t,fat:c,comp,ord:'z'}); } } }
  return out.sort((a,b)=>a.data.localeCompare(b.data)||a.ord.localeCompare(b.ord));
}
function balAt(acc,txs,D){ if(acc.saldoIni==null||acc.saldoIni===''||!acc.saldoData) return null; const sd=acc.saldoData; let b=Number(acc.saldoIni);
  if(D>=sd){ for(const t of txs) if(t.data>sd&&t.data<=D) b+=t.v; } else { for(const t of txs) if(t.data>D&&t.data<=sd) b-=t.v; }
  return r2(b); }
function extratoHtml(){
  const ym=compOf(S.year,S.month); const tipoF=S.xTipo||'todos'; const payF=S.xPay||'';
  const src=S.lanc.filter(l=>l.status!=='pulado'&&(Number(l.valor)||0)>0&&(l.data||'').slice(0,7)===ym);
  const used=[...new Set(src.map(l=>l.pay).filter(Boolean))]; (S.cfg.pays||[]).forEach(p=>{ if(isRealAcct(p)&&(p.saldoData||(S.cfg.pays||[]).some(x=>x.pagoPor===p.id))) used.push(p.id); });
  const list=src.filter(l=>{ const t=tipoOf(l); if(tipoF==='s'&&t!=='s') return false; if(tipoF==='e'&&t!=='e') return false; if(payF&&l.pay!==payF) return false; return true; })
    .sort((a,b)=>(a.data||'').localeCompare(b.data||'')||(a.criado||'').localeCompare(b.criado||''));
  const sumS=r2(list.filter(l=>tipoOf(l)==='s').reduce((a,l)=>a+Number(l.valor),0)), sumE=r2(list.filter(l=>tipoOf(l)==='e').reduce((a,l)=>a+Number(l.valor),0));
  let h=`<div class="xbar"><div class="qsort" style="margin:0" role="group" aria-label="Tipo">${[['todos','Tudo'],['s','Saídas'],['e','Entradas']].map(([k,l])=>`<button data-act="xtipo" data-k="${k}" aria-pressed="${tipoF===k}">${l}</button>`).join('')}</div>
    <select id="x_pay" aria-label="Conta ou cartão"><option value="">Todas as contas e cartões</option>${sortedPays().filter(p=>used.includes(p.id)||p.id===payF).map(p=>`<option value="${esc(p.id)}"${p.id===payF?' selected':''}>${esc(p.nome)}${p.final?' · '+esc(p.final):''}</option>`).join('')}</select></div>`;
  if(!list.length&&!isRealAcct(payById(payF))) return h+`<div class="grp"><p class="empty">Nenhum lançamento ${payF?'nessa conta ':''}em ${MESES[S.month-1].toLowerCase()}.</p></div>`;
  const sg=v=>(v<0?'− ':'')+fmt(Math.abs(v));
  const acc=payById(payF);
  if(isRealAcct(acc)) return h+acctStmt(acc,ym,tipoF);
  h+=`<div class="stmt"><div class="st-h"><span>Data</span><span>Lançamento</span><span class="r">Valor</span><span class="r">Saldo</span></div>`;
  h+=`<div class="st-row st-bal"><span>01/${String(S.month).padStart(2,'0')}</span><span>Saldo inicial do mês</span><span></span><span class="r num">${fmt(0)}</span></div>`;
  let bal=0; let i=0;
  while(i<list.length){
    const d=list[i].data; 
    while(i<list.length&&list[i].data===d){ const l=list[i++]; const c=catById(l.cat)||{}; const p=payById(l.pay); const isE=tipoOf(l)==='e'; const v=Number(l.valor);
      bal=r2(bal+(isE?v:-v));
      const meta=[p?(p.nome+(p.final?' · '+p.final:'')):'', l.cliente, l.parcela?'parcela '+l.parcela:''].filter(Boolean).join(' · ');

function defaultRecebido(cat){ const c=catById(cat); if(!c||c.tipo!=='e') return null; if(c.payPadrao&&payById(c.payPadrao)) return c.payPadrao;

function descSugs(cat){
  const src=(S.all||S.lanc).filter(l=>l.desc&&l.status!=='pulado'&&!/^Na planilha/.test(l.desc)&&l.desc.length<=80);
  const m=new Map();
  for(const l of src){ const k=l.desc.trim(); const key=norm(k); let o=m.get(key); if(!o){o={desc:k,n:0,nCat:0,last:'',pay:null};m.set(key,o);}
    o.n++; if(l.cat===cat) o.nCat++; const d=l.criado||l.data||''; if(d>=o.last){o.last=d;o.pay=l.pay;o.desc=k;} }
  return [...m.values()].sort((a,b)=>(b.nCat-a.nCat)||(b.n-a.n)||b.last.localeCompare(a.last));
}

async function saveLanc(){
  const $=id=>document.getElementById(id); const err=$('f_err'); err.hidden=true;
  const fail=m=>{err.textContent=m;err.hidden=false};
  const valor=parseValor($('f_valor').value); if(!(valor>0)) return fail('Digite um valor maior que zero, por exemplo 71,00.');
  let cat=$('f_cat').value; if(!cat) return fail('Escolha uma categoria.');
  if(cat==='__new'){
    const nome=$('f_nc_nome').value.trim(), grupo=$('f_nc_grupo').value.trim()||'Outros';
    if(!nome) return fail('Dê um nome para a nova categoria.');
    cat=await addCat({nome,grupo,tipo:F.tipo,cliente:F.tipo==='e'}); if(!cat) return fail('Não consegui criar a categoria. Tente de novo.');
  }
  const data=$('f_data').value||todayStr; const pay=$('f_pay').value||'conta';
  const comp=F.comp||compFor(data,pay);
  const base={cat,valor,data,pay,comp,ano:Number(comp.slice(0,4)),desc:$('f_desc').value.trim(),cliente:F.tipo==='e'?$('f_cli').value.trim():'',criado:new Date().toISOString()};
  if(F.recId){base.recId=F.recId;base.status='ok'}
  const parc=Math.max(1,Math.min(36,Number($('f_parc').value)||1));
  const btn=sheet.querySelector('[data-act="savelanc"]'); btn.disabled=true;
  try{
    const col=S.db.collection('lanc');
    if(F.id){ const old=S.lanc.find(l=>l.id===F.id)||{}; const keep={}; ['parcela','grupo','recId','status','origem'].forEach(k=>{if(old[k]!==undefined&&base[k]===undefined)keep[k]=old[k]}); await col.doc(F.id).set(Object.assign(keep,base)); toast('Lançamento salvo'); }
    else if(parc>1){ const g='g'+Date.now().toString(36); const each=r2(valor/parc);
      for(let i=0;i<parc;i++){const c=addM(comp,i); const v=i===parc-1?r2(valor-each*(parc-1)):each;
        await col.add(Object.assign({},base,{valor:v,comp:c,ano:Number(c.slice(0,4)),parcela:`${i+1}/${parc}`,grupo:g,valorTotal:valor}));}
      toast(`${parc} parcelas lançadas`); }
    else { await col.add(base); toast('Lançado'); }
    closeSheet(); if(S.tab==='busca') loadAll();
  }catch(e){ btn.disabled=false; fail(e?.code==='quota_exceeded'?'O banco do app encheu. Me avise para arquivar anos antigos.':'Não consegui salvar agora. Confira a conexão e tente de novo.'); }
}

async function addCat({nome,grupo,tipo,cliente}){
  let id=nome.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'cat';
  while(catById(id)) id+='-2';
  const sameGroup=S.cfg.cats.filter(c=>c.grupo===grupo&&c.tipo===tipo);
  const ordem=sameGroup.length?Math.max(...sameGroup.map(c=>c.ordem))+0.01:Math.max(0,...S.cfg.cats.map(c=>c.ordem))+1;
  const cats=S.cfg.cats.concat([{id,nome,grupo,tipo,cliente:!!cliente,ativo:true,ordem}]);
  try{ await saveCfg({cats}); return id; }catch(e){ return null; }
}

async function savePay(id,tipo){

    pays=S.cfg.pays.concat([Object.assign(isC?{id:nid,nome,tipo:'cartao',fecha:f,vence:v}:{id:nid,nome,tipo:'conta'},extra)]); }

function hideGate(){ gate.hidden=true; }
function msgAuth(e){ const c=(e&&e.code)||'';
  if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')) return 'E-mail ou senha não conferem.';
  if(c.includes('email-already-in-use')) return 'Já existe uma conta com esse e-mail. Toque em "Já tenho conta".';
  if(c.includes('weak-password')) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(c.includes('invalid-email')) return 'Esse e-mail não parece certo.';
  if(c.includes('too-many-requests')) return 'Muitas tentativas. Espere alguns minutos.';
  if(c.includes('network')) return 'Sem conexão com a internet.';
  return 'Não deu certo ('+c+'). Tente de novo.'; }

async function montarBackup(){

async function importarArquivo(file){
  let b; try{ b=JSON.parse(await file.text()); }catch(e){ toast('Esse arquivo não é um backup válido.'); return; }
  if(!b||b.app!=='videofotista-monetario'){ toast('Esse arquivo não é um backup do Monetário.'); return; }
  const ops=[]; if(b.config&&b.config.main) ops.push(['config/main',b.config.main]);
  for(const k of ['lanc','recs','faturas']) for(const id in (b[k]||{})) ops.push([k+'/'+id,b[k][id]]);
  const nL=Object.keys(b.lanc||{}).length;
  openSheet('Importar backup',`<p class="note">Backup de ${esc((b.exportadoEm||'').slice(0,10).split('-').reverse().join('/'))}: <b>${nL}</b> lançamentos, ${Object.keys(b.recs||{}).length} contas fixas e assinaturas, cartões e faturas.</p><p class="note">O que já estiver na casa com o mesmo registro é substituído pelo do backup. Nada mais é apagado.</p><div class="err" id="imp_err" hidden></div><div class="formacts"><div class="r"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn accent" id="imp_go">Importar</button></div></div>`);
  document.getElementById('imp_go').onclick=async ev=>{ const btn=ev.currentTarget; btn.disabled=true;
    try{ const base='casas/'+S.casa.id+'/'; let feitos=0;
      if(S.db.local){ await S.db.lote(ops); feitos=ops.length; }
      else for(let i=0;i<ops.length;i+=400){ const wb=FB.writeBatch(fs); for(const [p,d] of ops.slice(i,i+400)) wb.set(FB.doc(fs,base+p),d); await wb.commit(); feitos+=Math.min(400,ops.length-i); btn.textContent=`Importando… ${Math.round(feitos/ops.length*100)}%`; }
      closeSheet(); S.all=null; subYear(); toast(`Pronto: ${nL} lançamentos importados`);
    }catch(e){ console.warn(e); btn.disabled=false; btn.textContent='Importar'; const er=document.getElementById('imp_err'); er.textContent='Não consegui importar ('+(e.code||'erro')+'). Tente de novo.'; er.hidden=false; } };
}

function blobB64(blob){ return new Promise((ok,ko)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]); r.onerror=ko; r.readAsDataURL(blob); }); }
async function salvarArquivo(nome,blob){
  const h=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.salvar;
  if(h){ h.postMessage({nome,b64:await blobB64(blob)}); toast('Salvo na pasta Downloads'); return; }
  if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&navigator.canShare){ try{ const f=new File([blob],nome,{type:blob.type}); if(navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); return; } }catch(e){ if(e&&e.name==='AbortError') return; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },3000); toast('Arquivo baixado');
}
function autoBackup(){

}

function crc16(s){ let c=0xFFFF; for(let i=0;i<s.length;i++){ c^=s.charCodeAt(i)<<8; for(let j=0;j<8;j++) c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF; } return c.toString(16).toUpperCase().padStart(4,'0'); }
function pixPayload(){ const f=(id,v)=>id+String(v.length).padStart(2,'0')+v; const sa=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');

    try{ await FB.updateDoc(FB.doc(fs,'casas',S.casa.id),{emails:FB.arrayRemove(b.dataset.e)}); toast('Removido'); }catch(e){ toast('Não consegui remover.'); } return; }
});

function onErr(e){ console.warn(e); if(e?.code==='permission-denied'&&S.user){ pararTudo(); abrirCasa(); } }
function boot(){
  const ok=initFB(); const local=lsGet('vm_modo')==='local';
  if(local) usarLocal();
  if(!ok){ if(!local) showGate('semconfig'); return; }
  if(!local) showGate('carregando','Abrindo…');
  FB.onAuthStateChanged(auth,u=>{ S.user=u; if(lsGet('vm_modo')==='local') return; pararTudo(); if(!u){ showGate('login'); return; } abrirCasa(); });
}
boot();
})();
</script>
</body>
